<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMA AI Coach Ultimate</title>

<!-- ספריות Three.js + TensorFlow.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.155.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.155.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.12.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection/dist/movenet.min.js"></script>

<style>
body { margin:0; overflow:hidden; background:#111; font-family: Arial; }
canvas { display:block; }
#hud {
    position:absolute;
    top:10px; left:10px;
    color:#fff;
    background: rgba(0,0,0,0.6);
    padding:10px; border-radius:10px;
    max-width:300px;
}
#modeSelector {
    position:absolute; top:10px; right:10px;
    background: rgba(0,0,0,0.5); padding:10px;
    border-radius:10px; color:#fff;
}
video { display:none; }
</style>
</head>
<body>

<div id="hud">
<h3>MMA AI Coach Ultimate</h3>
מצב: <span id="currentMode">מאמן אישי</span><br>
קומבואים: <span id="combo">0</span><br>
מהירות: <span id="speed">0</span><br>
כוח: <span id="power">0</span><br>
זווית: <span id="angle">0</span><br>
הצלחה: <span id="accuracy">0%</span><br>
חיי האויב: <span id="enemyHealth">100</span><br>
</div>

<div id="modeSelector">
<button onclick="setMode('coach')">מאמן אישי</button>
<button onclick="setMode('fight')">קרב מול דמות</button>
</div>

<script>
    // =================== שלבים 1 + 2 ===================
    let mode='coach';
    function setMode(newMode){
        mode=newMode;
        document.getElementById('currentMode').innerText = mode==='coach'? 'מאמן אישי':'קרב מול דמות';
        resetStats();
    }

    let stats={
        combo:0,speed:0,power:0,angle:0,accuracy:0
    };

    function resetStats(){
        stats.combo=0; stats.speed=0; stats.power=0; stats.angle=0; stats.accuracy=0;
        updateHUD();
    }

    function updateHUD(){
        document.getElementById('combo').innerText = stats.combo;
        document.getElementById('speed').innerText = stats.speed.toFixed(1);
        document.getElementById('power').innerText = stats.power.toFixed(1);
        document.getElementById('angle').innerText = stats.angle.toFixed(1);
        document.getElementById('accuracy').innerText = stats.accuracy.toFixed(1)+'%';
        document.getElementById('enemyHealth').innerText = enemyHealth.toFixed(0);
    }

    // =================== מצלמה + Pose Detection ===================
    let video, detector;
    async function initCamera(){
        video=document.createElement('video');
        video.width=640; video.height=480;
        video.autoplay=true; video.playsInline=true;
        const stream = await navigator.mediaDevices.getUserMedia({video:true,audio:false});
        video.srcObject=stream;
        document.body.appendChild(video);
    }

    async function initDetector(){
        const model=poseDetection.SupportedModels.MoveNet;
        const detectorConfig={ modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING };
        detector = await poseDetection.createDetector(model, detectorConfig);
    }

    function calculateStats(keypoints){
        let speed=0,power=0,angle=0;
        const rightWrist=keypoints.find(p=>p.name==='right_wrist');
        const leftWrist=keypoints.find(p=>p.name==='left_wrist');

        if(rightWrist && leftWrist){
            if(rightWrist.lastPos){
                const dx=rightWrist.x-rightWrist.lastPos.x;
                const dy=rightWrist.y-rightWrist.lastPos.y;
                speed=Math.sqrt(dx*dx+dy*dy)*30;
            }
            rightWrist.lastPos={x:rightWrist.x, y:rightWrist.y};

            if(leftWrist.lastPos){
                const dx=leftWrist.x-leftWrist.lastPos.x;
                const dy=leftWrist.y-leftWrist.lastPos.y;
                speed += Math.sqrt(dx*dx+dy*dy)*30;
            }
            leftWrist.lastPos={x:leftWrist.x, y:leftWrist.y};
        }

        power=speed*0.8;
        angle=90;
        stats.speed=speed; stats.power=power; stats.angle=angle;
        stats.accuracy=Math.min(100,(speed+power)/5);

        if(mode==='coach' && speed>15) stats.combo++;
        updateHUD();
    }

    async function detectPose(){
        if(!detector || !video) return;
        const poses = await detector.estimatePoses(video);
        if(poses && poses.length>0){
            const keypoints=poses[0].keypoints.map((kp,i)=>({...kp,name:kp.name||poseDetection.keypoints[i].name}));
            calculateStats(keypoints);
        }
        requestAnimationFrame(detectPose);
    }

    async function startAI(){
        await initCamera();
        await initDetector();
        detectPose();
    }

    startAI();

    // =================== שלב 3 – דמות 3D + קרב ===================
    let scene,camera3D,renderer,clock,mixer,character;
    let actionIdle,actionPunch,actionKick,actionBlock;
    let enemyHealth=100;

    function init3D(){
        scene=new THREE.Scene();
        scene.background=new THREE.Color(0x111111);

        camera3D=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);
        camera3D.position.set(0,1.6,3);

        renderer=new THREE.WebGLRenderer({antialias:true});
        renderer.setSize(window.innerWidth,window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const light=new THREE.HemisphereLight(0xffffff,0x444444,1.2);
        light.position.set(0,20,0);
        scene.add(light);

        const floorGeometry=new THREE.PlaneGeometry(10,10);
        const floorMaterial=new THREE.MeshStandardMaterial({color:0x222222});
        const floor=new THREE.Mesh(floorGeometry,floorMaterial);
        floor.rotation.x=-Math.PI/2;
        scene.add(floor);

        clock=new THREE.Clock();

        const loader=new THREE.GLTFLoader();
        loader.load('https://threejs.org/examples/models/gltf/Xbot.glb', function(gltf){
            character=gltf.scene;
            character.scale.set(1.2,1.2,1.2);
            scene.add(character);

            mixer=new THREE.AnimationMixer(character);

            actionIdle=mixer.clipAction(gltf.animations.find(a=>a.name.toLowerCase().includes('idle')));
            actionPunch=mixer.clipAction(gltf.animations.find(a=>a.name.toLowerCase().includes('punch')));
            actionKick=mixer.clipAction(gltf.animations.find(a=>a.name.toLowerCase().includes('kick')));
            actionBlock=mixer.clipAction(gltf.animations.find(a=>a.name.toLowerCase().includes('block')));
            actionIdle.play();
        });

        const controls=new THREE.OrbitControls(camera3D,renderer.domElement);
        controls.target.set(0,1,0);
        controls.update();

        window.addEventListener('resize',()=>{camera3D.aspect=window.innerWidth/window.innerHeight;camera3D.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);},false);
    }

    function fightAI(){
        if(!character) return;

        // התקפה על הדמות
        if(stats.power>20){
            playAction('Punch');
            enemyHealth-=stats.power*0.5;
            enemyHealth=Math.max(0,enemyHealth);
        }
        updateHUD();
    }

    function playAction(actionName){
        if(!mixer) return;

        actionIdle.stop();
        switch(actionName){
            case 'Punch': if(actionPunch) actionPunch.reset().play(); break;
            case 'Kick': if(actionKick) actionKick.reset().play(); break;
            case 'Block': if(actionBlock) actionBlock.reset().play(); break;
        }
        setTimeout(()=>{if(actionIdle) actionIdle.play();},800);
    }

    function animate3D(){
        requestAnimationFrame(animate3D);
        const delta=clock.getDelta();
        if(mixer) mixer.update(delta);
        if(mode==='fight') fightAI();
        renderer.render(scene,camera3D);
    }

    init3D();
    animate3D();

    // =================== שלבים 4–7: סאונד, קומבואים, היסטוריה, דירוג רמות, גרפים ===================
    let hitSound=new Audio('https://www.soundjay.com/human/sounds/punch-01.mp3');
    function playHitSound(){ hitSound.play(); }

    // קומבואים
    function checkCombo(){
        if(stats.combo>5){
            console.log("קומבו מטורף! 🎯");
            playHitSound();
        }
    }

    // שמירת אימונים
    function saveHistory(){
        let history=JSON.parse(localStorage.getItem('mmaHistory')||"[]");
        history.push({...stats,date:new Date().toISOString()});
        localStorage.setItem('mmaHistory',JSON.stringify(history));
    }

    setInterval(()=>{
        saveHistory();
        checkCombo();
    },5000);

</script>
</body>
</html>
