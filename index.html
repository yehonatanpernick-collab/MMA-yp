<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMA AI Coach + Fight</title>

<!-- ספריות -->
<script src="https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.155.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.155.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.12.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

<style>
body { margin:0; overflow:hidden; background:#111; font-family:Arial; }
canvas, video { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; display:block; z-index:0;}
#hud {
    position:absolute; top:10px; left:10px;
    background:rgba(0,0,0,0.6); color:#fff; padding:15px; border-radius:15px;
    max-width:350px; font-size:14px; z-index:10;
}
#modeSelector {
    position:absolute; top:10px; right:10px;
    background: rgba(0,0,0,0.5); padding:10px; border-radius:10px; color:#fff; z-index:10;
}
button { margin:2px; padding:5px; border:none; border-radius:5px; cursor:pointer; background:#222; color:#fff;}
button:hover { background:#444; }
#videoElement { width:200px; height:150px; bottom:10px; right:10px; position:absolute; z-index:5; border:2px solid #fff; }
</style>
</head>
<body>

<div id="hud">
<h2>MMA AI Coach Pro</h2>
מצב: <span id="currentMode">מאמן אישי</span><br>
קומבואים: <span id="combo">0</span><br>
מהירות: <span id="speed">0</span><br>
כוח: <span id="power">0</span><br>
דיוק: <span id="accuracy">0%</span><br>
חיי האויב: <span id="enemyHealth">100</span><br>
רמת קושי: <span id="difficultyLevel">1</span>
</div>

<div id="modeSelector">
<button onclick="setMode('coach')">מאמן אישי</button>
<button onclick="setMode('fight')">קרב מול דמות</button><br>
<button onclick="setDifficulty(1)">קל</button>
<button onclick="setDifficulty(2)">בינוני</button>
<button onclick="setDifficulty(3)">קשה</button>
</div>

<video id="videoElement" autoplay playsinline muted></video>

<script>
// =================== הגדרות מצב ===================
let mode = 'coach';
let difficulty = 1;

function setMode(newMode){
    mode = newMode;
    document.getElementById('currentMode').innerText = mode==='coach'?'מאמן אישי':'קרב מול דמות';
    resetStats();

    if(mode==='coach'){
        video.style.display='block';
        canvas3D.style.display='none';
        if(!poseRunning) startPoseDetection();
    } else {
        video.style.display='block'; // מצלמה קטנה לצד
        canvas3D.style.display='block';
    }
}

function setDifficulty(level){
    difficulty = level;
    document.getElementById('difficultyLevel').innerText = difficulty;
}

// =================== סטטיסטיקות ===================
let stats = {combo:0, speed:0, power:0, accuracy:0};
let enemyHealth = 100;

function resetStats(){
    stats={combo:0, speed:0, power:0, accuracy:0};
    enemyHealth=100;
    updateHUD();
}

function updateHUD(){
    document.getElementById('combo').innerText = stats.combo;
    document.getElementById('speed').innerText = stats.speed.toFixed(1);
    document.getElementById('power').innerText = stats.power.toFixed(1);
    document.getElementById('accuracy').innerText = stats.accuracy.toFixed(1)+'%';
    document.getElementById('enemyHealth').innerText = enemyHealth.toFixed(0);
}

// =================== מצלמה + Pose Detection ===================
let video = document.getElementById('videoElement');
let detector;
let poseRunning = false;

async function initCamera(){
    const stream = await navigator.mediaDevices.getUserMedia({video:true, audio:false});
    video.srcObject = stream;
}

async function initDetector(){
    const model = poseDetection.SupportedModels.MoveNet;
    detector = await poseDetection.createDetector(model, {modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING});
}

async function startPoseDetection(){
    if(poseRunning) return;
    poseRunning = true;
    await initCamera();
    await initDetector();
    detectPose();
}

function calculateStats(keypoints){
    let speed=0;
    const rightWrist=keypoints.find(p=>p.name==='right_wrist');
    const leftWrist=keypoints.find(p=>p.name==='left_wrist');

    if(rightWrist && rightWrist.lastPos){
        const dx=rightWrist.x-rightWrist.lastPos.x;
        const dy=rightWrist.y-rightWrist.lastPos.y;
        speed=Math.sqrt(dx*dx+dy*dy)*30;
    }
    if(rightWrist) rightWrist.lastPos={x:rightWrist.x, y:rightWrist.y};

    if(leftWrist && leftWrist.lastPos){
        const dx=leftWrist.x-leftWrist.lastPos.x;
        const dy=leftWrist.y-leftWrist.lastPos.y;
        speed += Math.sqrt(dx*dx+dy*dy)*30;
    }
    if(leftWrist) leftWrist.lastPos={x:leftWrist.x, y:leftWrist.y};

    stats.speed = speed;
    stats.power = speed*0.8;
    stats.accuracy = Math.min(100,(speed*0.8));
    if(speed>15) stats.combo++;
    updateHUD();
}

async function detectPose(){
    if(!detector || mode!=='coach') return;
    const poses = await detector.estimatePoses(video);
    if(poses.length>0){
        const keypoints = poses[0].keypoints.map((kp,i)=>({...kp,name:kp.name||poseDetection.keypoints[i].name}));
        calculateStats(keypoints);
    }
    requestAnimationFrame(detectPose);
}

// =================== דמות 3D ===================
let scene, camera3D, renderer, clock, mixer, character;
let actionIdle, actionPunch, actionKick, actionBlock;
let canvas3D;

function init3D(){
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    camera3D = new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);
    camera3D.position.set(0,1.6,3);

    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    canvas3D = renderer.domElement;
    canvas3D.style.display='none';
    document.body.appendChild(canvas3D);

    const light = new THREE.HemisphereLight(0xffffff, 0x444444,1.2);
    light.position.set(0,20,0);
    scene.add(light);

    const floor = new THREE.Mesh(new THREE.PlaneGeometry(10,10), new THREE.MeshStandardMaterial({color:0x222222}));
    floor.rotation.x = -Math.PI/2;
    scene.add(floor);

    clock = new THREE.Clock();

    const loader = new THREE.GLTFLoader();
    loader.load('https://threejs.org/examples/models/gltf/Xbot.glb', function(gltf){
        character = gltf.scene;
        character.scale.set(1.2,1.2,1.2);
        scene.add(character);

        mixer = new THREE.AnimationMixer(character);
        actionIdle = mixer.clipAction(gltf.animations.find(a=>a.name.toLowerCase().includes('idle')));
        actionPunch = mixer.clipAction(gltf.animations.find(a=>a.name.toLowerCase().includes('punch')));
        actionKick = mixer.clipAction(gltf.animations.find(a=>a.name.toLowerCase().includes('kick')));
        actionBlock = mixer.clipAction(gltf.animations.find(a=>a.name.toLowerCase().includes('block')));
        actionIdle.play();
    });

    const controls = new THREE.OrbitControls(camera3D,canvas3D);
    controls.target.set(0,1,0);
    controls.update();

    window.addEventListener('resize',()=>{camera3D.aspect=window.innerWidth/window.innerHeight;camera3D.updateProjectionMatrix();renderer.setSize(window.innerWidth, window.innerHeight);},false);
}

function fightAI(){
    if(!character || mode!=='fight') return;
    if(stats.power>20){
        playAction('Punch');
        enemyHealth -= stats.power*0.5*difficulty;
        enemyHealth=Math.max(0,enemyHealth);
    }
    updateHUD();
}

function playAction(actionName){
    if(!mixer) return;
    actionIdle.stop();
    switch(actionName){
        case 'Punch': if(actionPunch) actionPunch.reset().play(); break;
        case 'Kick': if(actionKick) actionKick.reset().play(); break;
        case 'Block': if(actionBlock) actionBlock.reset().play(); break;
    }
    setTimeout(()=>{if(actionIdle) actionIdle.play();},800);
}

function animate3D(){
    requestAnimationFrame(animate3D);
    const delta=clock.getDelta();
    if(mixer) mixer.update(delta);
    fightAI();
    renderer.render(scene,camera3D);
}

init3D();
animate3D();

// =================== סאונד ===================
let hitSound=new Audio('https://www.soundjay.com/human/sounds/punch-01.mp3');
function playHitSound(){ hitSound.play(); }

</script>
</body>
</html>
